<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Age Verification Required</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-icon">
        <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1>Age-Restricted Content</h1>
      <p class="gate-desc">
        This page contains content that is only suitable for adults.<br>
        By continuing, you confirm that you are at least <strong>18&nbsp;years&nbsp;old</strong>.
      </p>
      <button id="verify-btn" class="btn-primary">Confirm &amp; Continue</button>
      <p class="gate-footer">By clicking, you agree to our Terms of Service and Privacy&nbsp;Policy.</p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
